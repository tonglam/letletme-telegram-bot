name: CI/CD Pipeline

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate workflow
        run: docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" rhysd/actionlint:1.7.7 -color /repo/.github/workflows/ci-cd.yml

      - name: Set up Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
        with:
          bun-version: "1.2.12"

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck

      - name: Check shell scripts
        run: shellcheck scripts/*.sh

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Run tests
        run: bun test

      - name: Build
        run: bun run build

      - name: Prepare deploy bundle
        run: |
          mkdir -p bundle
          cp -R dist bundle/dist
          cp -R scripts bundle/scripts
          cp -R deploy bundle/deploy
          cp README.md bundle/README.md
          cp DEPLOYMENT.md bundle/DEPLOYMENT.md
          tar -czf "letletme-telegram-bot-${GITHUB_SHA}.tar.gz" -C bundle .

      - name: Upload deploy bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: letletme-telegram-bot-dist
          path: "letletme-telegram-bot-${{ github.sha }}.tar.gz"

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download deploy bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: letletme-telegram-bot-dist
          path: .

      - name: Create app home on server
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f # v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USERNAME }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            mkdir -p /home/workspace/letletme-telegram-bot/{releases,logs,run}

      - name: Copy bundle to server
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USERNAME }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "letletme-telegram-bot-${{ github.sha }}.tar.gz"
          target: "/home/workspace/letletme-telegram-bot/"

      - name: Configure runtime API token
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f # v1.2.2
        env:
          NOTIFICATION_API_TOKEN: ${{ secrets.NOTIFICATION_API_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USERNAME }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: NOTIFICATION_API_TOKEN
          script: |
            set -euo pipefail
            APP_HOME=/home/workspace/letletme-telegram-bot
            ENV_FILE="$APP_HOME/.env"
            [[ -n "${NOTIFICATION_API_TOKEN:-}" ]]
            test -f "$ENV_FILE"
            backup="$ENV_FILE.bak.$(date -u +%Y%m%dT%H%M%SZ)"
            cp -p "$ENV_FILE" "$backup"
            temp_file=$(mktemp "$ENV_FILE.tmp.XXXXXX")
            awk '
              BEGIN { replaced = 0 }
              /^[[:space:]]*NOTIFICATION_API_TOKEN=/ {
                if (!replaced) {
                  print "NOTIFICATION_API_TOKEN=" ENVIRON["NOTIFICATION_API_TOKEN"]
                  replaced = 1
                }
                next
              }
              { print }
              END {
                if (!replaced) print "NOTIFICATION_API_TOKEN=" ENVIRON["NOTIFICATION_API_TOKEN"]
              }
            ' "$ENV_FILE" > "$temp_file"
            chmod 600 "$temp_file"
            mv "$temp_file" "$ENV_FILE"
            unset NOTIFICATION_API_TOKEN
            echo "Updated NOTIFICATION_API_TOKEN in $ENV_FILE; backup created at $backup"

      - name: Deploy release with rollback
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f # v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USERNAME }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          request_pty: true
          script: |
            set -euo pipefail
            APP_HOME=/home/workspace/letletme-telegram-bot
            RELEASE_ID=${{ github.sha }}
            ARCHIVE="$APP_HOME/letletme-telegram-bot-${RELEASE_ID}.tar.gz"
            RELEASES_DIR="$APP_HOME/releases"
            RELEASE_PATH="$RELEASES_DIR/$RELEASE_ID"
            STAGING_PATH="$RELEASES_DIR/.${RELEASE_ID}.staging"
            CURRENT_LINK="$APP_HOME/current"

            test -f "$APP_HOME/.env"
            if ! grep -Eq '^[[:space:]]*NOTIFICATION_API_TOKEN=[^[:space:]#]+([[:space:]]*#.*)?$' "$APP_HOME/.env"; then
              echo "NOTIFICATION_API_TOKEN is missing or empty in $APP_HOME/.env" >&2
              if [[ -x "$APP_HOME/scripts/start.sh" ]]; then
                APP_HOME="$APP_HOME" "$APP_HOME/scripts/start.sh" || true
              fi
              exit 1
            fi

            previous=""
            if [[ -L "$CURRENT_LINK" ]]; then
              previous=$(readlink -f "$CURRENT_LINK" 2>/dev/null || true)
            fi

            if [[ "$previous" == "$RELEASE_PATH" && -d "$RELEASE_PATH" ]]; then
              APP_HOME="$APP_HOME" CURRENT_LINK="$CURRENT_LINK" "$CURRENT_LINK/scripts/rerun.sh"
              APP_HOME="$APP_HOME" CURRENT_LINK="$CURRENT_LINK" "$CURRENT_LINK/scripts/healthcheck.sh"
              rm -f "$ARCHIVE"
              exit 0
            fi

            rm -rf "$STAGING_PATH"
            mkdir -p "$STAGING_PATH"
            tar -xzf "$ARCHIVE" -C "$STAGING_PATH"
            test -f "$STAGING_PATH/dist/index.js"
            test -f "$STAGING_PATH/scripts/start.sh"
            test -f "$STAGING_PATH/deploy/logrotate/letletme-telegram-bot"
            chmod +x "$STAGING_PATH/scripts"/*.sh
            rm -rf "$RELEASE_PATH"
            mv "$STAGING_PATH" "$RELEASE_PATH"

            if [[ "$(id -u)" -eq 0 ]]; then
              root_command=()
            elif command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
              root_command=(sudo -n)
            elif command -v doas >/dev/null 2>&1 && doas -n true 2>/dev/null; then
              root_command=(doas -n)
            else
              echo "Installing logrotate requires root or passwordless sudo/doas; release not activated." >&2
              echo "remote_user=$(id -un) uid=$(id -u) sudo=$(command -v sudo || true) doas=$(command -v doas || true)" >&2
              rm -rf "$RELEASE_PATH"
              exit 1
            fi

            if ! command -v logrotate >/dev/null 2>&1; then
              if ! command -v apt-get >/dev/null 2>&1; then
                echo "logrotate is not installed and apt-get is unavailable; release not activated." >&2
                rm -rf "$RELEASE_PATH"
                exit 1
              fi
              "${root_command[@]}" apt-get update
              "${root_command[@]}" env DEBIAN_FRONTEND=noninteractive apt-get install --yes logrotate
            fi

            "${root_command[@]}" install -m 0644 \
              "$RELEASE_PATH/deploy/logrotate/letletme-telegram-bot" \
              /etc/logrotate.d/letletme-telegram-bot
            "${root_command[@]}" logrotate -d /etc/logrotate.d/letletme-telegram-bot >/dev/null

            ln -sfn "$RELEASE_PATH" "$CURRENT_LINK"
            if ! APP_HOME="$APP_HOME" CURRENT_LINK="$CURRENT_LINK" "$CURRENT_LINK/scripts/rerun.sh"; then
              if [[ -n "$previous" && -d "$previous" ]]; then
                ln -sfn "$previous" "$CURRENT_LINK"
                if ! APP_HOME="$APP_HOME" CURRENT_LINK="$CURRENT_LINK" "$CURRENT_LINK/scripts/rerun.sh"; then
                  if [[ -x "$APP_HOME/scripts/start.sh" ]]; then
                    APP_HOME="$APP_HOME" "$APP_HOME/scripts/start.sh" || true
                  fi
                fi
              elif [[ -x "$APP_HOME/scripts/start.sh" ]]; then
                APP_HOME="$APP_HOME" "$APP_HOME/scripts/start.sh" || true
              else
                APP_HOME="$APP_HOME" CURRENT_LINK="$CURRENT_LINK" "$CURRENT_LINK/scripts/stop.sh" || true
              fi
              exit 1
            fi

            APP_HOME="$APP_HOME" CURRENT_LINK="$CURRENT_LINK" "$CURRENT_LINK/scripts/healthcheck.sh"
            rm -f "$ARCHIVE"

            while IFS= read -r old_release; do
              [[ -z "$old_release" ]] || rm -rf -- "$old_release"
            done < <(find "$RELEASES_DIR" -mindepth 1 -maxdepth 1 -type d -not -name '.*' -printf '%T@ %p\n' | sort -nr | awk 'NR > 3 { sub(/^[^ ]+ /, ""); print }')
